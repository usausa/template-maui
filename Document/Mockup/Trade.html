<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
.body { position: absolute; inset: 0; display: flex; flex-direction: column; background: #10151B; color: #FFFFFF; }

/* Symbol header */
.sym { flex: 0 0 auto; padding: 10rem 14rem 9rem; border-bottom: 1rem solid rgba(255,255,255,.08); }
.sym .n { display: flex; align-items: center; gap: 8rem; }
.sym .n .code { padding: 2rem 7rem; border-radius: 4rem; background: rgba(255,255,255,.12);
  font-size: 11rem; font-weight: 600; font-family: 'JetBrainsMono', monospace; }
.sym .n .t { font-size: 15rem; font-weight: 600; }
.sym .n .mk { margin-left: auto; display: flex; align-items: center; gap: 4rem; font-size: 10rem;
  color: var(--green-a3); }
.sym .n .mk i { width: 5rem; height: 5rem; border-radius: 50%; background: var(--green-a3); }
.sym .p { display: flex; align-items: baseline; gap: 10rem; margin-top: 7rem; }
.sym .p .v { font-size: 34rem; font-weight: 600; letter-spacing: -.03em; line-height: 1;
  font-family: 'JetBrainsMono', monospace; color: var(--green-a3); }
.sym .p .d { font-size: 14rem; font-weight: 600; color: var(--green-a3); }
.sym .p .tm { margin-left: auto; font-size: 10rem; color: rgba(255,255,255,.5); }
.sym .st { display: flex; gap: 16rem; margin-top: 8rem; }
.sym .st div { font-size: 10rem; color: rgba(255,255,255,.5); }
.sym .st div b { display: block; font-size: 12rem; color: #FFFFFF; margin-top: 2rem;
  font-family: 'JetBrainsMono', monospace; font-weight: 400; }

/* Timeframe */
.tf { flex: 0 0 auto; display: flex; gap: 3rem; padding: 8rem 12rem; }
.tf div { flex: 1; text-align: center; padding: 5rem 0; border-radius: 5rem; font-size: 11rem;
  color: rgba(255,255,255,.55); background: rgba(255,255,255,.07); }
.tf div.on { background: var(--blue-d2); color: #FFFFFF; font-weight: 600; }

/* Chart */
.chart { flex: 0 0 auto; position: relative; margin: 0 12rem; height: 196rem; }
.chart .gl { position: absolute; left: 0; right: 42rem; height: 1rem; background: rgba(255,255,255,.07); }
.chart .ax { position: absolute; right: 0; font-size: 9rem; color: rgba(255,255,255,.4);
  font-family: 'JetBrainsMono', monospace; transform: translateY(-50%); }
.chart .plot { position: absolute; left: 0; right: 42rem; top: 0; bottom: 42rem; }
.chart .vol { position: absolute; left: 0; right: 42rem; bottom: 0; height: 38rem; }
.chart .k { position: absolute; }
.chart .wick { width: 1.4rem; margin-left: 3.3rem; }
.chart .last { position: absolute; left: 0; right: 42rem; height: 1rem;
  background: repeating-linear-gradient(to right, var(--amber) 0 5rem, transparent 5rem 9rem); }
.chart .lastv { position: absolute; right: 0; padding: 1rem 4rem; border-radius: 3rem;
  background: var(--amber); color: #212121; font-size: 9rem; font-weight: 600;
  font-family: 'JetBrainsMono', monospace; transform: translateY(-50%); }

/* Order book */
.bk { flex: 1 1 auto; display: flex; flex-direction: column; margin-top: 8rem; overflow: hidden; }
.bk .h { display: grid; grid-template-columns: 1fr 84rem 1fr; padding: 5rem 12rem;
  font-size: 10rem; color: rgba(255,255,255,.45); background: rgba(255,255,255,.05); }
.bk .h div:nth-child(1) { text-align: right; }
.bk .h div:nth-child(2) { text-align: center; }
.bk .r { display: grid; grid-template-columns: 1fr 84rem 1fr; align-items: center;
  height: 25rem; padding: 0 12rem; position: relative; }
.bk .r .q { font-size: 12rem; font-family: 'JetBrainsMono', monospace; position: relative; z-index: 2; }
.bk .r .q.a { text-align: right; color: rgba(255,255,255,.85); }
.bk .r .q.b { text-align: left; color: rgba(255,255,255,.85); }
.bk .r .px { text-align: center; font-size: 13rem; font-weight: 600; position: relative; z-index: 2;
  font-family: 'JetBrainsMono', monospace; }
.bk .r .bar { position: absolute; top: 3rem; bottom: 3rem; border-radius: 2rem; z-index: 1; }
.bk .r .bar.a { right: 50%; margin-right: 42rem; background: rgba(239,83,80,.26); }
.bk .r .bar.b { left: 50%; margin-left: 42rem; background: rgba(38,166,154,.26); }
.bk .r.ask .px { color: #EF5350; }
.bk .r.bid .px { color: #26A69A; }
.bk .r.mid { height: 29rem; background: rgba(255,193,7,.12);
  border-top: 1rem solid rgba(255,193,7,.4); border-bottom: 1rem solid rgba(255,193,7,.4); }
.bk .r.mid .px { color: var(--amber); font-size: 15rem; }
.bk .r.mid .q { font-size: 10rem; color: rgba(255,255,255,.55); }

/* Action */
.act { flex: 0 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 8rem; padding: 9rem 12rem 11rem; }
.act div { padding: 12rem 0; border-radius: 8rem; text-align: center; font-size: 16rem; font-weight: 600; }
.act .sell { background: #D32F2F; }
.act .buy { background: #00897B; }
</style>
</head>
<body>
<div class="phone">

  <div class="statusbar">
    <div class="time">10:12</div>
    <div class="tray"><i class="mi">&#xe202;</i><i class="mi">&#xe63e;</i><div class="bat">44</div></div>
  </div>

  <div class="header">
    <div class="title">Trade</div>
    <div class="hicon"><i class="mi">&#xe6e1;</i></div>
    <div class="hicon"><i class="mi">&#xe5d4;</i></div>
  </div>

  <div class="content">
    <div class="body">

      <div class="sym">
        <div class="n">
          <div class="code">7203</div>
          <div class="t">トヨタ自動車</div>
          <div class="mk"><i></i>東証プライム ・ 前場</div>
        </div>
        <div class="p">
          <div class="v">3,482.0</div>
          <div class="d">+58.5 (+1.71%)</div>
          <div class="tm">10:12:34 更新</div>
        </div>
        <div class="st">
          <div>始値<b>3,431.0</b></div>
          <div>高値<b>3,496.5</b></div>
          <div>安値<b>3,418.0</b></div>
          <div>出来高<b>18,426千</b></div>
        </div>
      </div>

      <div class="tf">
        <div>1分</div><div class="on">5分</div><div>日足</div><div>週足</div><div>月足</div>
      </div>

      <div class="chart" id="chart"></div>

      <div class="bk">
        <div class="h"><div>売数量</div><div>気配値</div><div>買数量</div></div>
        <div id="book"></div>
      </div>

      <div class="act">
        <div class="sell">売　注文</div>
        <div class="buy">買　注文</div>
      </div>

    </div>
  </div>

  <div class="functionbar">
    <div class="f1">Back</div>
    <div class="f2">歩み値</div>
    <div class="f3">チャート</div>
    <div class="f4">注文</div>
  </div>

  <div class="gesturebar"></div>

</div>

<script>
// ---- Candles ----
let s = 7203;
const rnd = () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;

const N = 42;
const candles = [];
let px = 3431;
for (let i = 0; i < N; i++) {
  const o = px;
  const drift = (i / N) * 1.4 - 0.3;
  const c = o + (rnd() - 0.5 + drift * 0.35) * 16;
  const h = Math.max(o, c) + rnd() * 9;
  const l = Math.min(o, c) - rnd() * 9;
  candles.push({ o, h, l, c, v: 0.3 + rnd() * 0.7 });
  px = c;
}
candles[N - 1].o = 3474;
candles[N - 1].c = 3482;
candles[N - 1].h = Math.max(candles[N - 1].h, 3486);
candles[N - 1].l = Math.min(candles[N - 1].l, 3472);

const hi = Math.max(...candles.map((x) => x.h));
const lo = Math.min(...candles.map((x) => x.l));
const pad = (hi - lo) * 0.08;
const pTop = hi + pad, pBot = lo - pad;

const PLOT = 154;   // dp (chart height 196 - vol 38 - gap 4)
const W = 357;      // dp (411 - 24 margin - 42 axis)
const CW = W / N;

const y = (p) => ((pTop - p) / (pTop - pBot)) * PLOT;

let h = '';
// grid + axis
for (let i = 0; i <= 4; i++) {
  const yy = (i / 4) * PLOT;
  const p = pTop - (i / 4) * (pTop - pBot);
  h += '<div class="gl" style="top:' + yy.toFixed(1) + 'rem"></div>';
  h += '<div class="ax" style="top:' + yy.toFixed(1) + 'rem">' + p.toFixed(0) + '</div>';
}
h += '<div class="plot">';
candles.forEach((k, i) => {
  const up = k.c >= k.o;
  const col = up ? '#26A69A' : '#EF5350';
  const x = i * CW;
  const bodyTop = y(Math.max(k.o, k.c));
  const bodyH = Math.max(1, Math.abs(y(k.o) - y(k.c)));
  h += '<div class="k wick" style="left:' + x.toFixed(2) + 'rem;top:' + y(k.h).toFixed(2) +
    'rem;height:' + (y(k.l) - y(k.h)).toFixed(2) + 'rem;background:' + col + '"></div>';
  h += '<div class="k" style="left:' + x.toFixed(2) + 'rem;top:' + bodyTop.toFixed(2) +
    'rem;width:' + (CW - 1.6).toFixed(2) + 'rem;height:' + bodyH.toFixed(2) +
    'rem;background:' + col + '"></div>';
});
h += '</div>';
// volume
h += '<div class="vol">';
candles.forEach((k, i) => {
  const up = k.c >= k.o;
  const col = up ? 'rgba(38,166,154,.55)' : 'rgba(239,83,80,.55)';
  h += '<div class="k" style="left:' + (i * CW).toFixed(2) + 'rem;bottom:0;width:' + (CW - 1.6).toFixed(2) +
    'rem;height:' + (k.v * 34).toFixed(1) + 'rem;background:' + col + '"></div>';
});
h += '</div>';
// last price line
h += '<div class="last" style="top:' + y(3482).toFixed(1) + 'rem"></div>';
h += '<div class="lastv" style="top:' + y(3482).toFixed(1) + 'rem">3482</div>';
document.getElementById('chart').innerHTML = h;

// ---- Order book ----
const asks = [[3486.5, 12400], [3485.5, 8200], [3484.5, 21700], [3483.5, 5400], [3483.0, 9100]];
const bids = [[3482.0, 15800], [3481.5, 7300], [3480.5, 26400], [3479.5, 4900], [3478.5, 11200]];
const maxQ = 26400;
const fmt = (n) => n.toLocaleString('ja-JP');

let b = asks.map(([p, q]) =>
  '<div class="r ask"><div class="q a">' + fmt(q) + '</div>' +
  '<div class="px">' + p.toFixed(1) + '</div><div class="q b"></div>' +
  '<div class="bar a" style="width:' + (q / maxQ * 42).toFixed(1) + '%"></div></div>').join('');

b += '<div class="r mid"><div class="q a">売 92,800</div>' +
  '<div class="px">3,482.0</div><div class="q b">買 108,400</div></div>';

b += bids.map(([p, q]) =>
  '<div class="r bid"><div class="q a"></div>' +
  '<div class="px">' + p.toFixed(1) + '</div><div class="q b">' + fmt(q) + '</div>' +
  '<div class="bar b" style="width:' + (q / maxQ * 42).toFixed(1) + '%"></div></div>').join('');

document.getElementById('book').innerHTML = b;
</script>
</body>
</html>
