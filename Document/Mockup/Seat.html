<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
.body { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg-d4); color: #FFFFFF; }

/* Title */
.film { flex: 0 0 auto; padding: 10rem 14rem 9rem; background: var(--bg-d3); }
.film .t { font-size: 19rem; font-weight: 600; letter-spacing: -.02em; }
.film .s { display: flex; align-items: center; gap: 8rem; margin-top: 5rem; font-size: 12rem; color: var(--bg-l3); }
.film .s .tag { padding: 2rem 7rem; border-radius: 4rem; background: var(--indigo); color: #FFFFFF; font-weight: 600; }

/* Screen */
.screen { flex: 0 0 auto; padding: 14rem 24rem 6rem; }
.screen .bar { height: 14rem; border-radius: 50% / 100% 100% 0 0;
  background: linear-gradient(to bottom, #FFFFFF, rgba(255,255,255,.15)); }
.screen .cap { margin-top: 4rem; text-align: center; font-size: 11rem; letter-spacing: .4em; color: var(--bg-l3); }

/* Seats */
.area { flex: 1 1 auto; position: relative; overflow: hidden; display: flex; align-items: center; }
.map { width: 100%; padding: 0 10rem; }
.srow { display: grid; align-items: center; gap: 2.5rem;
  grid-template-columns: 14rem repeat(3, 19rem) 11rem repeat(10, 19rem) 11rem repeat(3, 19rem) 14rem;
  margin-bottom: 2.5rem; }
.srow .lbl { font-size: 11rem; color: var(--bg-l3); text-align: center; }
.seat { height: 19rem; border-radius: 4rem 4rem 2rem 2rem; background: transparent;
  border: 1.5rem solid var(--bg-l3); }
.seat.sold { background: var(--bg-d2); border-color: var(--bg-d2); }
.seat.sel { background: var(--blue); border-color: var(--blue-l3);
  box-shadow: 0 0 0 2rem rgba(33,150,243,.35); position: relative; }
.seat.sel::after { content: '\e5ca'; font-family: 'MaterialIcons'; position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center; font-size: 13rem; color: #FFFFFF; }
.seat.wc { background: var(--teal); border-color: var(--teal); position: relative; }
.seat.pre { border-color: var(--amber); }
.gap { }

.cols { display: grid; gap: 2.5rem; margin: 5rem 0 0;
  grid-template-columns: 14rem repeat(3, 19rem) 11rem repeat(10, 19rem) 11rem repeat(3, 19rem) 14rem; }
.cols div { font-size: 9rem; color: var(--bg-l3); text-align: center; }

/* Zoom + minimap */
.zoom { position: absolute; left: 12rem; bottom: 12rem; display: flex; flex-direction: column; gap: 1rem;
  border-radius: 8rem; overflow: hidden; box-shadow: 0 2rem 8rem rgba(0,0,0,.5); }
.zoom div { width: 36rem; height: 36rem; display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,.14); font-size: 22rem; }
.minimap { position: absolute; right: 12rem; bottom: 12rem; width: 86rem; height: 62rem;
  border-radius: 6rem; background: rgba(255,255,255,.10); border: 1rem solid rgba(255,255,255,.25); padding: 5rem; }
.minimap .mm { width: 100%; height: 100%; position: relative;
  background: repeating-linear-gradient(to bottom, rgba(255,255,255,.35) 0 2rem, transparent 2rem 5rem); }
.minimap .vp { position: absolute; left: 6%; top: 18%; width: 72%; height: 64%;
  border: 2rem solid var(--blue-l3); border-radius: 3rem; background: rgba(33,150,243,.20); }

/* Legend */
.legend { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
  padding: 8rem 14rem; background: var(--bg-d3); font-size: 11rem; color: var(--bg-l3); }
.legend span { display: flex; align-items: center; gap: 5rem; }
.legend i { width: 13rem; height: 13rem; border-radius: 3rem 3rem 1rem 1rem; display: inline-block; }

/* Footer */
.sum { flex: 0 0 auto; display: flex; align-items: center; gap: 12rem; padding: 10rem 14rem;
  background: #FFFFFF; color: var(--gray-d4); }
.sum .l { flex: 1; }
.sum .l .c { font-size: 11rem; color: var(--gray-d1); }
.sum .l .c b { color: var(--blue-d2); font-size: 13rem; }
.sum .l .p { font-size: 22rem; font-weight: 600; letter-spacing: -.02em; }
.sum .l .p em { font-style: normal; font-size: 12rem; color: var(--gray-d1); margin-left: 4rem; }
.sum button { border: 0; cursor: default; font-family: inherit; padding: 11rem 22rem; border-radius: 8rem;
  background: var(--blue-d2); color: #FFFFFF; font-size: 16rem; font-weight: 600; }
</style>
</head>
<body>
<div class="phone">

  <div class="statusbar">
    <div class="time">18:24</div>
    <div class="tray"><i class="mi">&#xe202;</i><i class="mi">&#xe63e;</i><div class="bat">64</div></div>
  </div>

  <div class="header">
    <div class="title">Seat</div>
    <div class="hicon"><i class="mi">&#xe54d;</i></div>
    <div class="hicon"><i class="mi">&#xe5d4;</i></div>
  </div>

  <div class="content">
    <div class="body">

      <div class="film">
        <div class="t">インターステラー IMAX リマスター</div>
        <div class="s">
          <div class="tag">SCREEN 7</div>
          <span>10/19 (日) 19:10 &ndash; 22:00</span>
          <span>字幕</span>
        </div>
      </div>

      <div class="screen">
        <div class="bar"></div>
        <div class="cap">SCREEN</div>
      </div>

      <div class="area">
        <div class="map" id="map"></div>
        <div class="zoom"><div>+</div><div>&minus;</div></div>
        <div class="minimap"><div class="mm"><div class="vp"></div></div></div>
      </div>

      <div class="legend">
        <span><i style="border:1.5rem solid var(--bg-l3)"></i>空席</span>
        <span><i style="background:var(--bg-d2)"></i>販売済</span>
        <span><i style="background:var(--blue)"></i>選択中</span>
        <span><i style="border:1.5rem solid var(--amber)"></i>プレミア</span>
        <span><i style="background:var(--teal)"></i>車椅子</span>
      </div>

      <div class="sum">
        <div class="l">
          <div class="c">選択 <b>2</b> 席 ・ G-8, G-9</div>
          <div class="p">¥3,600<em>一般 2枚</em></div>
        </div>
        <button>購入へ進む</button>
      </div>

    </div>
  </div>

  <div class="functionbar">
    <div class="f1">Back</div>
    <div class="f2">回次</div>
    <div class="f3">全体</div>
    <div class="f4">確定</div>
  </div>

  <div class="gesturebar"></div>

</div>

<script>
const rows = 'ABCDEFGHIJKLMNOP'.split('');
const sold = {
  A: [4, 5, 6, 12],
  B: [1, 2, 7, 8, 9, 15, 16],
  C: [5, 6, 10, 11, 12],
  D: [3, 4, 7, 13, 14],
  E: [6, 7, 8, 9, 10, 14],
  F: [2, 5, 11, 12, 15],
  G: [4, 5, 6, 13, 14],
  H: [1, 7, 8, 10, 11, 16],
  I: [3, 9, 12, 13],
  J: [5, 6, 7, 14, 15],
  K: [2, 8, 11],
  L: [4, 9, 10],
  M: [1, 6, 7, 13],
  N: [3, 8, 9, 10, 15],
  O: [2, 5, 11, 12],
  P: [7, 8]
};
const selected = { G: [8, 9] };
const premium = ['H', 'I'];
const wheel = { P: [1, 16] };

const map = document.getElementById('map');
let html = '';
for (const r of rows) {
  html += '<div class="srow"><div class="lbl">' + r + '</div>';
  for (let c = 1; c <= 16; c++) {
    if (c === 4 || c === 14) html += '<div class="gap"></div>';
    let cls = 'seat';
    if ((wheel[r] || []).includes(c)) cls += ' wc';
    else if ((selected[r] || []).includes(c)) cls += ' sel';
    else if ((sold[r] || []).includes(c)) cls += ' sold';
    else if (premium.includes(r)) cls += ' pre';
    html += '<div class="' + cls + '"></div>';
  }
  html += '<div class="lbl">' + r + '</div></div>';
}
let cols = '<div class="cols"><div></div>';
for (let c = 1; c <= 16; c++) {
  if (c === 4 || c === 14) cols += '<div></div>';
  cols += '<div>' + c + '</div>';
}
cols += '<div></div></div>';
map.innerHTML = html + cols;
</script>
</body>
</html>
