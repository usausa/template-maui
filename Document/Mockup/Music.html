<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
.body { position: absolute; inset: 0; display: flex; flex-direction: column; color: #FFFFFF;
  background: linear-gradient(180deg, #4A148C 0%, #311B92 38%, #1A237E 72%, #0D1B3E 100%); }

.top { flex: 0 0 auto; display: flex; align-items: center; gap: 10rem; padding: 9rem 16rem 2rem; }
.top .mi { font-size: 20rem; }
.top .c { flex: 1; text-align: center; }
.top .c .k { font-size: 10rem; color: rgba(255,255,255,.6); letter-spacing: .1em; }
.top .c .v { font-size: 12rem; font-weight: 600; margin-top: 2rem; }

/* Art */
.artwrap { flex: 0 0 auto; display: flex; justify-content: center; padding: 10rem 0 0; }
.art { width: 212rem; height: 212rem; border-radius: 16rem; position: relative; overflow: hidden;
  box-shadow: 0 16rem 36rem rgba(0,0,0,.55); background: linear-gradient(140deg, #FF6F00, #D81B60 52%, #6A1B9A); }
.art .c1 { position: absolute; width: 130rem; height: 130rem; border-radius: 50%; left: -34rem; top: 28rem;
  background: radial-gradient(circle at 34% 34%, rgba(255,241,118,.92), rgba(255,109,0,.12) 68%); }
.art .c2 { position: absolute; width: 96rem; height: 96rem; border-radius: 50%; right: 16rem; bottom: -22rem;
  background: radial-gradient(circle at 60% 40%, rgba(130,177,255,.85), rgba(63,81,181,.05) 70%); }
.art .ln { position: absolute; left: 0; right: 0; top: 50%; height: 1.5rem; background: rgba(255,255,255,.42); }
.art .ln.b { top: 58%; opacity: .5; }
.art .ln.c { top: 42%; opacity: .25; }
.art .lb { position: absolute; left: 14rem; bottom: 12rem; font-size: 11rem; font-weight: 600;
  letter-spacing: .28em; color: rgba(255,255,255,.9); }

/* Title */
.ttl { flex: 0 0 auto; display: flex; align-items: center; gap: 12rem; padding: 16rem 20rem 0; }
.ttl .l { flex: 1; min-width: 0; }
.ttl .l .s { font-size: 21rem; font-weight: 600; letter-spacing: -.02em; }
.ttl .l .a { font-size: 13rem; color: rgba(255,255,255,.68); margin-top: 3rem; }
.ttl .mi { font-size: 24rem; color: var(--pink); }

/* Lyrics */
.lyr { flex: 1 1 auto; position: relative; overflow: hidden; padding: 12rem 20rem 0; }
.lyr .ls { display: flex; flex-direction: column; gap: 11rem; }
.lyr .ls div { font-size: 16rem; line-height: 1.3; color: rgba(255,255,255,.34); }
.lyr .ls div.done { color: rgba(255,255,255,.5); }
.lyr .ls div.cur { font-size: 21rem; font-weight: 600; color: #FFFFFF; letter-spacing: -.01em; }
.lyr .fade { position: absolute; left: 0; right: 0; bottom: 0; height: 40rem;
  background: linear-gradient(to bottom, rgba(13,27,62,0), rgba(13,27,62,.85)); }
.lyr .badge { position: absolute; right: 18rem; top: 6rem; display: flex; align-items: center; gap: 4rem;
  padding: 3rem 9rem; border-radius: 999rem; background: rgba(255,255,255,.14); font-size: 10rem; }
.lyr .badge .mi { font-size: 12rem; }

/* Seek */
.seek { flex: 0 0 auto; padding: 4rem 20rem 0; }
.seek .wave { display: flex; align-items: center; gap: 1.6rem; height: 30rem; }
.seek .wave i { display: block; width: 2.4rem; border-radius: 1.2rem; background: rgba(255,255,255,.28); }
.seek .wave i.p { background: #FFFFFF; }
.seek .wave i.head { background: var(--pink); width: 3.4rem; }
.seek .tm { display: flex; justify-content: space-between; margin-top: 5rem; font-size: 11rem;
  color: rgba(255,255,255,.6); font-family: 'JetBrainsMono', monospace; }

/* Controls */
.ctl { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
  padding: 10rem 26rem 0; }
.ctl .mi { font-size: 26rem; color: rgba(255,255,255,.8); }
.ctl .mi.big { font-size: 34rem; color: #FFFFFF; }
.ctl .play { width: 64rem; height: 64rem; border-radius: 50%; background: #FFFFFF;
  display: flex; align-items: center; justify-content: center; box-shadow: 0 6rem 18rem rgba(0,0,0,.4); }
.ctl .play .mi { font-size: 38rem; color: #1A237E; }

/* Bottom */
.btm { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
  padding: 12rem 24rem 14rem; font-size: 11rem; color: rgba(255,255,255,.65); }
.btm span { display: flex; align-items: center; gap: 5rem; }
.btm .mi { font-size: 15rem; }
</style>
</head>
<body>
<div class="phone">

  <div class="statusbar">
    <div class="time">22:13</div>
    <div class="tray"><i class="mi">&#xe202;</i><i class="mi">&#xe63e;</i><div class="bat">46</div></div>
  </div>

  <div class="header">
    <div class="title">Music</div>
    <div class="hicon"><i class="mi">&#xe040;</i></div>
    <div class="hicon"><i class="mi">&#xe5d4;</i></div>
  </div>

  <div class="content">
    <div class="body">

      <div class="top">
        <i class="mi">&#xe5cf;</i>
        <div class="c">
          <div class="k">PLAYING FROM</div>
          <div class="v">深夜のドライブ ・ 42 曲</div>
        </div>
        <i class="mi">&#xe5d4;</i>
      </div>

      <div class="artwrap">
        <div class="art">
          <div class="c1"></div>
          <div class="c2"></div>
          <div class="ln c"></div>
          <div class="ln"></div>
          <div class="ln b"></div>
          <div class="lb">MIDNIGHT LINE</div>
        </div>
      </div>

      <div class="ttl">
        <div class="l">
          <div class="s">夜明けのハイウェイ</div>
          <div class="a">NIGHT CIRCUIT ・ MIDNIGHT LINE</div>
        </div>
        <i class="mi">&#xe87d;</i>
      </div>

      <div class="lyr">
        <div class="badge"><i class="mi">&#xe8b5;</i>歌詞を同期中</div>
        <div class="ls">
          <div class="done">信号が変わるのを待っている</div>
          <div class="done">街の灯りが流れていく</div>
          <div class="cur">夜明けまであと少しだけ</div>
          <div>このまま走り続けよう</div>
          <div>誰も知らない道の先へ</div>
          <div>風が頬を撫でていく</div>
        </div>
        <div class="fade"></div>
      </div>

      <div class="seek">
        <div class="wave" id="wave"></div>
        <div class="tm"><span>2:18</span><span>-1:44</span></div>
      </div>

      <div class="ctl">
        <i class="mi">&#xe043;</i>
        <i class="mi big">&#xe045;</i>
        <div class="play"><i class="mi">&#xe034;</i></div>
        <i class="mi big">&#xe044;</i>
        <i class="mi">&#xe040;</i>
      </div>

      <div class="btm">
        <span><i class="mi">&#xe050;</i>リビングのスピーカー</span>
        <span>次の曲へ<i class="mi">&#xe8f3;</i></span>
      </div>

    </div>
  </div>

  <div class="functionbar">
    <div class="f1">Back</div>
    <div class="f2">歌詞</div>
    <div class="f3">キュー</div>
    <div class="f4">出力</div>
  </div>

  <div class="gesturebar"></div>

</div>

<script>
const wave = document.getElementById('wave');
let s = 991;
const rnd = () => (s = (s * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
const N = 86;
const head = 48;
let h = '';
for (let i = 0; i < N; i++) {
  const env = 0.35 + 0.65 * Math.abs(Math.sin(i / 7.5)) * (0.6 + 0.4 * rnd());
  const hh = (5 + env * 23).toFixed(1);
  const cls = i === head ? 'head' : (i < head ? 'p' : '');
  h += '<i class="' + cls + '" style="height:' + hh + 'rem"></i>';
}
wave.innerHTML = h;
</script>
</body>
</html>
