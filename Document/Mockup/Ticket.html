<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="common.css">
<style>
.body { position: absolute; inset: 0; display: flex; flex-direction: column; color: #FFFFFF;
  background: linear-gradient(160deg, #1A237E 0%, #4A148C 58%, #311B92 100%); }

/* Pager */
.pager { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
  padding: 10rem 16rem 4rem; }
.pager .c { font-size: 12rem; color: rgba(255,255,255,.75); }
.pager .c b { font-size: 16rem; color: #FFFFFF; }
.pager .bright { display: flex; align-items: center; gap: 5rem; padding: 5rem 11rem; border-radius: 999rem;
  background: rgba(255,255,255,.16); font-size: 11rem; font-weight: 600; }
.pager .bright .mi { font-size: 15rem; }

/* Stage */
.stage { flex: 1 1 auto; position: relative; padding: 8rem 18rem 0; display: flex; flex-direction: column; justify-content: center; }

.ticket { position: relative; border-radius: 16rem; background: #FFFFFF; color: var(--gray-d4);
  box-shadow: 0 10rem 30rem rgba(0,0,0,.45);
  z-index: 3; --notch: 12rem; --py: 50%;
  -webkit-mask-image:
    radial-gradient(circle var(--notch) at left var(--py), transparent 98%, #000 100%),
    radial-gradient(circle var(--notch) at right var(--py), transparent 98%, #000 100%);
  -webkit-mask-composite: source-in;
  mask-image:
    radial-gradient(circle var(--notch) at left var(--py), transparent 98%, #000 100%),
    radial-gradient(circle var(--notch) at right var(--py), transparent 98%, #000 100%);
  mask-composite: intersect;
}

.art { height: 120rem; border-radius: 16rem 16rem 0 0; position: relative; overflow: hidden;
  background: linear-gradient(120deg, #D81B60 0%, #8E24AA 50%, #3949AB 100%); }
.art .glow { position: absolute; width: 150rem; height: 150rem; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,.45), transparent 62%); top: -58rem; right: -24rem; }
.art .glow2 { position: absolute; width: 110rem; height: 110rem; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,235,59,.40), transparent 65%); bottom: -52rem; left: 24rem; }
.art .lv { position: absolute; left: 14rem; bottom: 11rem; }
.art .lv .tag { display: inline-block; padding: 2rem 8rem; border-radius: 4rem;
  background: rgba(0,0,0,.35); font-size: 10rem; font-weight: 600; color: #FFFFFF; }
.art .lv .nm { font-size: 20rem; font-weight: 600; color: #FFFFFF; margin-top: 4rem; letter-spacing: -.02em; }

.detail { padding: 16rem 16rem 0; }
.detail .sub { font-size: 12rem; color: var(--gray-d1); }
.detail .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15rem 10rem; margin-top: 14rem; }
.detail .grid .k { font-size: 10rem; color: var(--gray-l1); letter-spacing: .06em; }
.detail .grid .v { font-size: 16rem; font-weight: 600; margin-top: 1rem; letter-spacing: -.02em; }
.detail .grid .v em { font-style: normal; font-size: 11rem; color: var(--gray-d1); margin-left: 4rem; }
.detail .seat { margin-top: 15rem; display: flex; align-items: center; gap: 9rem;
  padding: 10rem 12rem; border-radius: 10rem; background: var(--indigo); color: #FFFFFF; }
.detail .seat .mi { font-size: 22rem; }
.detail .seat .k { font-size: 10rem; opacity: .8; }
.detail .seat .v { font-size: 19rem; font-weight: 600; letter-spacing: -.01em; }

.perf { margin-top: 17rem; border-top: 2rem dashed var(--gray-l2); }

.buyer { display: flex; align-items: center; gap: 8rem; padding: 0 16rem 14rem; }
.buyer .av { width: 26rem; height: 26rem; border-radius: 50%; background: var(--blue-gray); color: #FFFFFF;
  display: flex; align-items: center; justify-content: center; font-size: 12rem; font-weight: 600; }
.buyer .nm { font-size: 12rem; }
.buyer .nm em { display: block; font-style: normal; font-size: 10rem; color: var(--gray-l1); }
.buyer .warn { margin-left: auto; padding: 3rem 8rem; border-radius: 4rem; background: var(--red-l5);
  color: var(--red-d2); font-size: 10rem; font-weight: 600; }

.scan { padding: 16rem 16rem 14rem; display: flex; align-items: center; gap: 14rem; }
.scan .qr { width: 128rem; height: 128rem; flex: 0 0 auto; }
.scan .qr canvas { width: 100%; height: 100%; image-rendering: pixelated; }
.scan .r { flex: 1; min-width: 0; }
.scan .r .k { font-size: 10rem; color: var(--gray-l1); letter-spacing: .06em; }
.scan .r .no { font-family: 'JetBrainsMono', monospace; font-size: 15rem; font-weight: 600; margin-top: 2rem; }
.scan .r .bars { display: flex; align-items: flex-end; gap: 1rem; height: 36rem; margin-top: 10rem; }
.scan .r .bars i { display: block; background: var(--gray-d4); height: 100%; }
.scan .r .cap { font-size: 10rem; color: var(--gray-d1); margin-top: 5rem; }

/* Stacked peeks */
.peek { position: relative; height: 22rem; border-radius: 0 0 14rem 14rem;
  box-shadow: 0 6rem 16rem rgba(0,0,0,.30); }
.peek.p1 { margin: -14rem 13rem 0; z-index: 2; background: rgba(255,255,255,.62); }
.peek.p2 { margin: -13rem 26rem 0; z-index: 1; background: rgba(255,255,255,.34); }

/* Footer hint */
.hint { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; gap: 7rem;
  padding: 11rem 0 13rem; font-size: 12rem; color: rgba(255,255,255,.75); }
.hint .dots { display: flex; gap: 5rem; }
.hint .dots i { width: 6rem; height: 6rem; border-radius: 50%; background: rgba(255,255,255,.35); }
.hint .dots i.on { background: #FFFFFF; width: 16rem; border-radius: 3rem; }
</style>
</head>
<body>
<div class="phone">

  <div class="statusbar">
    <div class="time">17:46</div>
    <div class="tray"><i class="mi">&#xe202;</i><i class="mi">&#xe63e;</i><div class="bat">91</div></div>
  </div>

  <div class="header">
    <div class="title">Ticket</div>
    <div class="hicon"><i class="mi">&#xe638;</i></div>
    <div class="hicon"><i class="mi">&#xe5d4;</i></div>
  </div>

  <div class="content">
    <div class="body">

      <div class="pager">
        <div class="c"><b>2</b> / 3 枚</div>
        <div class="bright"><i class="mi">&#xe1ac;</i>画面を明るく</div>
      </div>

      <div class="stage">
        <div class="ticket">

          <div class="art">
            <div class="glow"></div>
            <div class="glow2"></div>
            <div class="lv">
              <div class="tag">ARENA TOUR 2026</div>
              <div class="nm">NIGHT CIRCUIT</div>
            </div>
          </div>

          <div class="detail">
            <div class="sub">名古屋公演 ・ 2 日目</div>
            <div class="grid">
              <div><div class="k">DATE</div><div class="v">10/19 <em>(日)</em></div></div>
              <div><div class="k">OPEN / START</div><div class="v">17:00<em>/ 18:00</em></div></div>
              <div><div class="k">VENUE</div><div class="v">名古屋ドーム</div></div>
              <div><div class="k">GATE</div><div class="v">7 番ゲート</div></div>
            </div>
            <div class="seat">
              <i class="mi">&#xe903;</i>
              <div><div class="k">SEAT</div><div class="v">3塁側 22 通路 D ブロック 14 列 208 番</div></div>
            </div>
          </div>

          <div class="perf"></div>

          <div class="buyer">
            <div class="av">佐</div>
            <div class="nm">佐藤 太郎<em>同行者 2 名 ・ クレジット払い</em></div>
            <div class="warn">転売禁止</div>
          </div>

          <div class="scan">
            <div class="qr"><canvas id="qr" width="29" height="29"></canvas></div>
            <div class="r">
              <div class="k">TICKET NO.</div>
              <div class="no">4821-0073-2956</div>
              <div class="bars" id="bars"></div>
              <div class="cap">入場時にスタッフへ提示してください</div>
            </div>
          </div>

        </div>
        <div class="peek p1"></div>
        <div class="peek p2"></div>
      </div>

      <div class="hint">
        <div class="dots"><i></i><i class="on"></i><i></i></div>
        左右スワイプで他のチケット
      </div>

    </div>
  </div>

  <div class="functionbar">
    <div class="f1">Back</div>
    <div class="f2">分配</div>
    <div class="f3">追加</div>
    <div class="f4">使用済</div>
  </div>

  <div class="gesturebar"></div>

</div>

<script>
// QR-like pattern (visual only)
const N = 29;
const c = document.getElementById('qr').getContext('2d');
c.fillStyle = '#FFFFFF';
c.fillRect(0, 0, N, N);
let seed = 20261019;
const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
c.fillStyle = '#212121';
for (let y = 0; y < N; y++) {
  for (let x = 0; x < N; x++) {
    const finder = (x < 8 && y < 8) || (x > N - 9 && y < 8) || (x < 8 && y > N - 9);
    if (finder) continue;
    if (rnd() > 0.52) c.fillRect(x, y, 1, 1);
  }
}
const eye = (ox, oy) => {
  c.fillStyle = '#212121'; c.fillRect(ox, oy, 7, 7);
  c.fillStyle = '#FFFFFF'; c.fillRect(ox + 1, oy + 1, 5, 5);
  c.fillStyle = '#212121'; c.fillRect(ox + 2, oy + 2, 3, 3);
};
eye(0, 0); eye(N - 7, 0); eye(0, N - 7);
c.fillStyle = '#212121';
c.fillRect(N - 9, N - 9, 5, 5);
c.fillStyle = '#FFFFFF';
c.fillRect(N - 8, N - 8, 3, 3);
c.fillStyle = '#212121';
c.fillRect(N - 7, N - 7, 1, 1);

// Notch position aligned to the perforation line
const tk = document.querySelector('.ticket');
const pf = document.querySelector('.perf');
tk.style.setProperty('--py', (pf.offsetTop / 2.625) + 'rem');

// Barcode
const bars = document.getElementById('bars');
let bh = '';
let s2 = 77;
for (let i = 0; i < 52; i++) {
  s2 = (s2 * 1103515245 + 12345) & 0x7fffffff;
  const w = 1 + (s2 % 3);
  bh += '<i style="width:' + w + 'rem;opacity:' + (i % 2 ? 0 : 1) + '"></i>';
}
bars.innerHTML = bh;
</script>
</body>
</html>
